[server]
maxUploadSize = 10
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#C8553D"
backgroundColor = "#FBF6EE"
secondaryBackgroundColor = "#F4ECDD"
textColor = "#2B2B33"
linkColor = "#1B2A4A"
borderColor = "#E9DCC6"
baseRadius = "14px"
buttonRadius = "full"
baseFontSize = 17
font = "Nunito:https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap, sans-serif"
headingFont = "Fraunces:https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap, serif"
